aid: jinba
name: Jinba
description: >-
  Jinba is an enterprise-grade platform for building, running, and deploying
  AI-powered workflows and agents using natural language. Business teams describe
  a process in plain language, refine it in a visual graph editor or a YAML
  manifest, and deploy it to production as an API or an MCP server. The product
  spans Jinba Flow (the workflow builder), Jinba App / App Neo (the execution and
  agent environment), and Jinba Toolbox (a centralized tool management and
  execution platform for AI agents that runs tools in isolated E2B or Daytona
  sandboxes). For developers, Jinba exposes two REST APIs — the Flow External API
  for invoking published workflows synchronously or asynchronously, and the
  Toolbox API for managing organizations, toolsets, tools, versions, runs,
  webhooks, and API keys — plus a TypeScript SDK, native Model Context Protocol
  (MCP) endpoints, webhooks with HMAC-signed payloads, and RFC 9457 error
  semantics. Jinba is SOC 2 Type 2 audited, supports SSO and RBAC, and offers
  on-premises or private-cloud (AWS/GCP/Azure) deployment. Founded by Shoya
  Matsumori and Takuya Norisugi; Y Combinator (Winter 2026).
