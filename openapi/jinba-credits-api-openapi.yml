openapi: 3.2.0
info:
  title: Jinba Toolbox Credits API
  version: v1
  description: REST API for Jinba Toolbox — a centralized tool management and execution platform for AI agents.
  x-apievangelist-method: generated
  x-apievangelist-source: https://docs.jinba.io/en/pages/toolbox/developer/api
  contact:
    name: Jinba
    url: https://jinba.io
servers:
- url: https://toolbox-api.jinba.dev/v1
  description: Production
security:
- bearerAuth: []
tags:
- name: Credits
paths:
  /orgs/{orgId}/credits:
    parameters:
    - $ref: '#/components/parameters/OrgId'
    get:
      tags:
      - Credits
      operationId: getCredits
      summary: Get credit balance
      responses:
        '200':
          description: Credit balance
          content:
            application/json:
              schema:
                type: object
                properties:
                  balance:
                    type: number
components:
  parameters:
    OrgId:
      name: orgId
      in: path
      required: true
      schema:
        type: string
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: 'Organization-scoped API key passed as a Bearer token. Keys use the jtb_ prefix (e.g. "Authorization: Bearer jtb_xxxxxxxxxxxx").'
